# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with: 
        lfs: 'true'
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget
    - name: Build, test, and update versioning
      run: ./build.ps1

    # Compile installer steps
    - name: Compile Windows-x64 installer (test)
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
      with:
        path: ./src/DAZ_Installer.Installer/Windows64.iss

    # Upload artifacts
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: src/DAZ_Installer.Installer/Output/*
        if-no-files-found: error
        retention-days: 3

    - name: Upload Windows project binaries artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-binaries
        path: src/DAZ_Installer.Windows/bin/*
        if-no-files-found: error
        retention-days: 3
